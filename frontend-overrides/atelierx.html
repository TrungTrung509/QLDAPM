    :root,
    [data-studio-theme="night"] {
      --bg-app: #050814;
      --bg-topbar: rgba(8, 13, 30, 0.92);
      --bg-sidebar: rgba(9, 14, 32, 0.96);
      --bg-card: rgba(17, 25, 52, 0.88);
      --bg-card-hover: rgba(24, 36, 72, 0.95);
      --bg-card-selected: rgba(26, 42, 88, 0.96);
      --bg-subtle: rgba(13, 20, 44, 0.9);
      --bg-canvas: radial-gradient(ellipse at 50% 38%, #162454 0%, #0b132e 48%, #050814 100%);
      --bg-hud: rgba(9, 15, 36, 0.84);
      --border-main: rgba(99, 132, 214, 0.24);
      --border-strong: rgba(56, 189, 248, 0.45);
      --border-selected: #22d3ee;
      --text-1: #eef4ff;
      --text-2: #b4c8ef;
      --text-3: #7e95c4;
      --accent: #22d3ee;
      --accent-ink: #041222;
      --accent-soft: rgba(34, 211, 238, 0.15);
      --neon-glow: 0 0 14px rgba(34, 211, 238, 0.28);
      --active-bg: linear-gradient(135deg, rgba(34, 211, 238, 0.16) 0%, rgba(168, 85, 247, 0.14) 100%);
      --active-border: #22d3ee;
      --active-text: #67e8f9;
      --queued-bg: rgba(245, 158, 11, 0.14);
      --queued-border: #f59e0b;
      --queued-text: #fcd34d;
      --review-bg: rgba(244, 63, 94, 0.16);
      --review-border: #fb7185;
      --review-text: #fda4af;
      --done-bg: rgba(16, 185, 129, 0.11);
      --done-border: rgba(52, 211, 153, 0.34);
      --done-text: #6ee7b7;
      --shadow-sm: 0 4px 14px rgba(2, 6, 23, 0.42);
      --shadow-md: 0 12px 28px rgba(2, 6, 23, 0.56);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.72);
      --grid-dot: #38bdf8;
      --grid-dot-opacity: 0.18;
    }

    [data-studio-theme="day"] {
      --bg-app: #eef3fc;
      --bg-topbar: rgba(255, 255, 255, 0.94);
      --bg-sidebar: #f5f8fd;
      --bg-card: #ffffff;
      --bg-card-hover: #fafcff;
      --bg-card-selected: #eef5ff;
      --bg-subtle: #eaf0fa;
      --bg-canvas: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #e6f0ff 48%, #cfe0fa 100%);
      --bg-hud: rgba(255, 255, 255, 0.9);
      --border-main: #d3dfef;
      --border-strong: #93c5fd;
      --border-selected: #2563eb;
      --text-1: #101d38;
      --text-2: #3d4f73;
      --text-3: #66789c;
      --accent: #2563eb;
      --accent-ink: #ffffff;
      --accent-soft: rgba(37, 99, 235, 0.11);
      --neon-glow: 0 4px 14px rgba(37, 99, 235, 0.22);
      --active-bg: linear-gradient(135deg, #eff6ff 0%, #ecfdf5 100%);
      --active-border: #2563eb;
      --active-text: #1d4ed8;
      --queued-bg: #fffbeb;
      --queued-border: #f59e0b;
      --queued-text: #b45309;
      --review-bg: #fff1f2;
      --review-border: #f43f5e;
      --review-text: #be123c;
      --done-bg: #f4fbf7;
      --done-border: #bbf7d0;
      --done-text: #15803d;
      --shadow-sm: 0 2px 8px rgba(16, 29, 56, 0.06);
      --shadow-md: 0 8px 24px rgba(16, 29, 56, 0.11);
      --shadow-lg: 0 22px 50px rgba(15, 23, 42, 0.2);
      --grid-dot: #6682ad;
      --grid-dot-opacity: 0.2;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-app);
      color: var(--text-1);
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 1px solid var(--border-main);
      background: var(--bg-card);
      border-radius: 8px;
      padding: 4px 9px;
      transition: background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, transform 0.12s ease;
    }

    button:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ================= TOP COMMAND BAR (SLIM SINGLE-ROW) ================= */
    .studio-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 12px;
      background: var(--bg-topbar);
      border-bottom: 1px solid var(--border-main);
      backdrop-filter: blur(14px);
      z-index: 30;
      flex-wrap: nowrap;
      min-width: 0;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-crest {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(135deg, #0ea5e9 0%, #7c3aed 54%, #ec4899 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .brand-row strong {
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text-1);
      white-space: nowrap;
    }

    .brand-edition {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 1.5px 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.18), rgba(244, 114, 182, 0.18));
      color: var(--accent);
      border: 1px solid rgba(34, 211, 238, 0.38);
      white-space: nowrap;
    }

    .kpi-ribbon {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .kpi-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3.5px 9px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-main);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-1);
      white-space: nowrap;
    }

    .kpi-chip.kpi-active {
      background: var(--active-bg);
      border-color: var(--active-border);
      color: var(--active-text);
    }

    .kpi-chip.is-filter-on {
      box-shadow: 0 0 0 1.5px var(--accent), var(--neon-glow);
      border-color: var(--accent);
    }

    .kpi-chip .kpi-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    #token-summary-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    #status {
      font-size: 11px;
      font-weight: 700;
      padding: 3.5px 9px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-main);
      color: var(--text-2);
      white-space: nowrap;
    }

    .icon-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .icon-pill-btn.is-syncing {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: var(--neon-glow);
    }

    @media (max-width: 1180px) {
      .brand-edition,
      #status {
        display: none;
      }
    }

    /* ================= WORKSPACE SPLIT (WIDE 3D + COMPACT SIDEBAR) ================= */
    .studio-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(248px, 20.5vw, 286px);
      min-height: 0;
      height: 100%;
      overflow: hidden;
      transition: grid-template-columns 0.22s ease;
    }

    body.sidebar-wide .studio-workspace {
      grid-template-columns: minmax(0, 1fr) clamp(324px, 27vw, 372px);
    }

    body.sidebar-collapsed .studio-workspace {
      grid-template-columns: minmax(0, 1fr) 0px;
    }

    body.sidebar-collapsed aside.command-sidebar {
      opacity: 0;
      pointer-events: none;
      border-left-width: 0;
      padding: 0;
    }

    /* ================= LEFT CYBER-COUTURE 3D FLOOR (h1) ================= */
    .floor {
      position: relative;
      background: var(--bg-canvas);
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .floor svg#scene {
      display: block;
      width: 100%;
      height: 100%;
      flex: 1;
      touch-action: none;
      cursor: grab;
    }

    .floor svg#scene:active {
      cursor: grabbing;
    }

    #scene text {
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .room {
      cursor: pointer;
    }

    .room.room-arch {
      transition: filter 0.18s ease;
    }

    .room.room-arch:hover,
    .room.room-arch:focus-visible {
      outline: none;
      filter: brightness(1.08) drop-shadow(0 0 12px rgba(34, 211, 238, 0.34));
    }

    .room.room-hud:hover rect {
      stroke-width: 1.8px;
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 0.28; }
    }

    @keyframes flow-dash {
      to { stroke-dashoffset: -28; }
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.36; }
    }

    .pulse-out {
      animation: pulse-ring 1.6s infinite ease-in-out;
    }

    .bridge-energy-active {
      stroke-dasharray: 9 6;
      animation: flow-dash 0.95s linear infinite;
    }

    .bridge-energy-queued {
      stroke-dasharray: 5 7;
      animation: flow-dash 1.8s linear infinite;
    }

    .orbital-ring {
      stroke-dasharray: 14 10;
      animation: flow-dash 6s linear infinite;
    }

    .live-beacon {
      animation: blink-dot 1.2s infinite ease-in-out;
    }

    /* Floating HUD overlays on Canvas */
    .canvas-hud-top {
      position: absolute;
      top: 9px;
      left: 11px;
      right: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
      z-index: 12;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
    }

    .hud-pill {
      background: var(--bg-hud);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-main);
      box-shadow: var(--shadow-sm);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .hud-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      box-shadow: var(--neon-glow);
    }

    .hud-pill.hud-showcase {
      border-color: rgba(244, 114, 182, 0.52);
      color: #f472b6;
    }

    [data-studio-theme="day"] .hud-pill.hud-showcase {
      color: #be185d;
    }

    .canvas-hud-bottom {
      position: absolute;
      bottom: 9px;
      left: 11px;
      right: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
      z-index: 12;
      flex-wrap: nowrap;
    }

    .canvas-legend {
      pointer-events: auto;
      background: var(--bg-hud);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-main);
      box-shadow: var(--shadow-sm);
      border-radius: 9px;
      padding: 4px 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .camera-dock {
      pointer-events: auto;
      background: var(--bg-hud);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-main);
      box-shadow: var(--shadow-md);
      border-radius: 9px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      flex-shrink: 0;
    }

    .camera-dock button {
      border-radius: 6.5px;
      padding: 4px 7.5px;
      font-size: 11px;
      font-weight: 700;
      border-color: transparent;
      background: transparent;
      white-space: nowrap;
    }

    .camera-dock button:hover {
      background: var(--bg-subtle);
      border-color: var(--border-main);
    }

    .camera-dock .dock-primary {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--border-strong);
    }

    @media (max-width: 1240px) {
      .canvas-legend .legend-hide-compact {
        display: none;
      }
    }

    /* ================= RIGHT COMPACT DEPARTMENT & TASK SIDEBAR (h2) ================= */
    aside.command-sidebar {
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-main);
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      transition: opacity 0.2s ease;
    }

    .sidebar-head {
      padding: 8px 10px 7px;
      background: var(--bg-topbar);
      border-bottom: 1px solid var(--border-main);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .sidebar-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .sidebar-title-row h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text-1);
      white-space: nowrap;
    }

    .sync-pill {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-head-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .tiny-btn {
      padding: 3px 7px;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 6px;
      background: var(--bg-subtle);
      color: var(--text-2);
      white-space: nowrap;
    }

    .tiny-btn.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--border-strong);
    }

    .dept-filter-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
    }

    .dept-filter-btn {
      padding: 3.5px 3px;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 7px;
      text-align: center;
      background: var(--bg-subtle);
      border: 1px solid transparent;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dept-filter-btn.active {
      background: var(--bg-card-selected);
      border-color: var(--accent);
      color: var(--accent);
    }

    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      scrollbar-width: thin;
    }

    /* Active Tasks Spotlight Box (hidden automatically when 0 active tasks) */
    .active-spotlight {
      background: var(--active-bg);
      border: 1px solid var(--active-border);
      border-radius: 9px;
      padding: 5px 7px;
      box-shadow: var(--neon-glow);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .active-spotlight[hidden] {
      display: none;
    }

    .spotlight-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .spotlight-title {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--active-text);
    }

    .spotlight-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spotlight-item {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-left: 3px solid var(--active-border);
      border-radius: 7px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .spotlight-item:hover {
      border-color: var(--active-border);
    }

    .spotlight-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
      color: var(--active-text);
    }

    .spotlight-item-main {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Minimal Department Cards (#rooms) */
    nav#rooms {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .dept-card {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 9px;
      padding: 5.5px 8px 6px 10px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      position: relative;
      overflow: hidden;
    }

    .dept-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3.5px;
      background: var(--dept-color, #22d3ee);
      opacity: 0.95;
    }

    .dept-card:hover {
      border-color: var(--border-strong);
    }

    .dept-card.has-active-work {
      border-color: rgba(34, 211, 238, 0.55);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.12);
    }

    .dept-card.is-selected {
      background: var(--bg-card-selected);
      border-color: var(--border-selected);
      box-shadow: 0 0 0 1px var(--border-selected), var(--shadow-sm);
    }

    .dept-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
    }

    .dept-identity {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .dept-emblem {
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
    }

    .dept-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .dept-name {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agent-state-dot {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--bg-subtle);
      color: var(--text-3);
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 88px;
    }

    .agent-state-dot.online {
      background: rgba(16, 185, 129, 0.15);
      color: var(--done-text);
    }

    .dept-badges {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1.5px 6px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .mini-pill.tok-ok {
      background: rgba(16, 185, 129, 0.14);
      color: var(--done-text);
      border-color: var(--done-border);
    }

    .mini-pill.tok-unlimited {
      background: var(--bg-subtle);
      color: var(--text-3);
      border-color: var(--border-main);
    }

    .mini-pill.tok-warn {
      background: var(--queued-bg);
      color: var(--queued-text);
      border-color: var(--queued-border);
    }

    .mini-pill.tok-out {
      background: var(--review-bg);
      color: var(--review-text);
      border-color: var(--review-border);
      animation: blink-dot 1.4s infinite;
    }

    .mini-pill.work-active {
      background: #2563eb;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .mini-pill.work-queued {
      background: var(--queued-bg);
      color: var(--queued-text);
      border-color: var(--queued-border);
    }

    .mini-pill.work-done {
      background: var(--done-bg);
      color: var(--done-text);
      border-color: var(--done-border);
    }

    .dept-progress-track {
      height: 3px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }

    .dept-progress-seg {
      height: 100%;
      transition: width 0.3s ease;
    }

    /* Compact Task Cards inside Department */
    .dept-tasks-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dept-task-card {
      border-radius: 7px;
      padding: 5px 7px;
      border: 1px solid var(--border-main);
      background: var(--bg-subtle);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .dept-task-card.bucket-active {
      background: var(--active-bg);
      border: 1px solid var(--active-border);
      border-left-width: 3.5px;
    }

    .dept-task-card.bucket-review {
      background: var(--review-bg);
      border: 1px solid var(--review-border);
      border-left-width: 3.5px;
    }

    .dept-task-card.bucket-queued {
      background: var(--queued-bg);
      border: 1px solid var(--queued-border);
      border-left-width: 3.5px;
    }

    .dept-task-card.bucket-done {
      background: transparent;
      border-color: var(--done-border);
      padding: 4px 7px;
    }

    .task-card-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      min-width: 0;
    }

    .task-card-main {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .task-id-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 4.5px;
      border-radius: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      color: var(--text-1);
      flex-shrink: 0;
    }

    .task-title-text {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
    }

    .task-title-text.is-expanded {
      white-space: normal;
      overflow: visible;
      word-break: break-word;
    }

    .bucket-done .task-title-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
    }

    .task-status-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .task-status-tag.tag-active {
      background: #2563eb;
      color: #ffffff;
    }

    .task-status-tag.tag-review {
      background: #e11d48;
      color: #ffffff;
    }

    .task-status-tag.tag-queued {
      background: #d97706;
      color: #ffffff;
    }

    .task-status-tag.tag-done {
      background: rgba(16, 185, 129, 0.16);
      color: var(--done-text);
    }

    .task-brief-box {
      font-size: 10.5px;
      color: var(--text-2);
      line-height: 1.35;
      padding-top: 2px;
      border-top: 1px dashed var(--border-main);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .task-blocker-note {
      font-size: 10px;
      line-height: 1.3;
      padding: 3px 6px;
      border-radius: 5px;
      background: var(--review-bg);
      border-left: 2.5px solid var(--review-border);
      color: var(--review-text);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .more-done-btn {
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-subtle);
      color: var(--text-2);
      border: 1px solid var(--border-main);
    }

    .dept-inspector-extra {
      border-top: 1px dashed var(--border-main);
      padding-top: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-3);
      font-weight: 700;
    }

    /* Runway 6-stage Pipeline inside Sàn Trưng Bày */
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }

    .pipeline-step {
      background: var(--bg-subtle);
      border: 1px solid var(--border-main);
      border-radius: 6px;
      padding: 3.5px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      width: 100%;
      text-align: left;
      min-width: 0;
    }

    .pipeline-step > span:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .pipeline-step:hover {
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    .showcase-cta-btn {
      width: 100%;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 7px;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.18), rgba(244, 114, 182, 0.18));
      border: 1px solid var(--border-strong);
      color: var(--text-1);
    }

    .showcase-cta-btn:hover {
      border-color: var(--accent);
      box-shadow: var(--neon-glow);
    }

    /* ================= MODAL QUOTA 6 AGENTS ================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 22, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      color: var(--text-1);
      width: 100%;
      max-width: 860px;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-main);
      background: var(--bg-topbar);
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .modal-close {
      background: transparent;
      border: none;
      font-size: 22px;
      line-height: 1;
      padding: 2px 8px;
      color: var(--text-2);
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-manage-btn {
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid var(--active-border);
      background: var(--active-bg);
      color: var(--active-text);
      cursor: pointer;
    }

    .modal-manage-btn:hover {
      filter: brightness(1.1);
    }

    .modal-body {
      padding: 14px 18px 18px;
      overflow-y: auto;
    }

    .modal-runtime-banner {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--queued-bg);
      border: 1px solid var(--queued-border);
      color: var(--queued-text);
      font-size: 11.5px;
      font-weight: 700;
    }

    .modal-runtime-banner[hidden] {
      display: none;
    }

    .modal-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .modal-tab-btn {
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--bg-subtle);
    }

    .modal-tab-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .token-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    .token-table th {
      background: var(--bg-subtle);
      padding: 8px 10px;
      border-bottom: 2px solid var(--border-main);
      font-weight: 800;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-2);
    }

    .token-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border-main);
      vertical-align: middle;
    }

    .token-table tr:hover td {
      background: var(--bg-card-hover);
    }

    /* ================= 3D PRODUCT SHOWCASE OVERLAY ================= */
    .showcase-overlay {
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: rgba(4, 8, 22, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      padding: 0;
    }

    .showcase-overlay.open {
      display: grid;
      place-items: stretch;
    }

    .showcase-shell {
      width: 100vw;
      height: 100dvh;
      background: var(--bg-card);
      color: var(--text-1);
      border: none;
      border-radius: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .showcase-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-main);
      background: var(--bg-topbar);
    }

    .showcase-head-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .showcase-crest {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #22d3ee 0%, #8b5cf6 56%, #ec4899 100%);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
      flex-shrink: 0;
    }

    .showcase-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .showcase-head h2 {
      margin: 0;
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .showcase-count-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--border-strong);
      white-space: nowrap;
    }

    .showcase-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .showcase-filters {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-main);
    }

    .showcase-filter-btn {
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
    }

    .showcase-filter-btn:hover {
      color: var(--text-1);
      background: var(--bg-card-hover);
    }

    .showcase-filter-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .showcase-action-btn {
      background: var(--bg-subtle);
      color: var(--text-1);
      border: 1px solid var(--border-main);
      border-radius: 9px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .showcase-action-btn:hover {
      border-color: var(--accent);
    }

    .showcase-close {
      background: var(--bg-subtle);
      color: var(--text-1);
      border: 1px solid var(--border-main);
      border-radius: 9px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 800;
    }

    .showcase-body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, 310px) 1fr;
    }

    .showcase-list {
      overflow: auto;
      padding: 12px;
      border-right: 1px solid var(--border-main);
      display: grid;
      align-content: start;
      gap: 9px;
      background: var(--bg-sidebar);
    }

    .showcase-product {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      color: var(--text-1);
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 11px 12px;
      display: grid;
      gap: 6px;
    }

    .showcase-product:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    .showcase-product.active {
      border-color: var(--accent);
      background: var(--bg-card-selected);
      box-shadow: var(--neon-glow);
    }

    .sp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .sp-category {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .sp-status {
      font-size: 10px;
      font-weight: 800;
      padding: 1.5px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .sp-status.is-complete {
      background: var(--done-bg);
      color: var(--done-text);
      border: 1px solid var(--done-border);
    }

    .sp-status.is-preview {
      background: var(--queued-bg);
      color: var(--queued-text);
      border: 1px solid var(--queued-border);
    }

    .sp-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .sp-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 0 1px var(--border-main);
      flex-shrink: 0;
    }

    .sp-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-1);
      line-height: 1.28;
    }

    .sp-tagline {
      margin: 0;
      font-size: 11.5px;
      line-height: 1.42;
      color: var(--text-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sp-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      color: var(--text-3);
      font-weight: 700;
      padding-top: 4px;
      border-top: 1px dashed var(--border-main);
    }

    .sp-foot > span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .showcase-empty {
      padding: 18px 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
    }

    .showcase-view {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .showcase-meta {
      padding: 10px 16px;
      font-size: 12.5px;
      color: var(--text-2);
      border-bottom: 1px solid var(--border-main);
      background: var(--bg-topbar);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
    }

    .sm-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .sm-swatch {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.5px solid var(--border-strong);
      flex-shrink: 0;
    }

    .sm-text {
      display: grid;
      gap: 1px;
      min-width: 0;
    }

    .sm-text strong {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-1);
    }

    .sm-sub {
      font-size: 11.5px;
      color: var(--text-3);
    }

    .sm-desc {
      margin: 0;
      font-size: 12px;
      color: var(--text-2);
      max-width: 560px;
    }

    .showcase-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg-app);
    }

    @media (max-width: 980px) {
      .studio-topbar {
        flex-wrap: wrap;
      }
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      .studio-workspace,
      body.sidebar-wide .studio-workspace,
      body.sidebar-collapsed .studio-workspace {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
      body.sidebar-collapsed aside.command-sidebar {
        display: none;
      }
      .floor {
        height: 58vh;
        min-height: 410px;
      }
      .canvas-hud-bottom {
        flex-wrap: wrap;
      }
      aside.command-sidebar {
        border-left: none;
        border-top: 1px solid var(--border-main);
        height: auto;
        overflow: visible;
      }
      .sidebar-scroll {
        overflow: visible;
      }
      .showcase-body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .showcase-list {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: 0;
        border-bottom: 1px solid var(--border-main);
      }
      .showcase-product {
        min-width: 240px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="studio-topbar">
    <div class="brand-cluster">
      <button id="btn-back-tickets" class="icon-pill-btn" type="button" title="Quay lại bảng Tickets">← Tickets</button>
      <div class="brand-crest" aria-hidden="true">✦</div>
      <div class="brand-row">
        <strong>ATELIERX</strong>
        <span class="brand-edition">Neon 3D</span>
      </div>
    </div>

    <div class="kpi-ribbon" id="kpi-ribbon" aria-label="Bộ lọc nhanh theo trạng thái">
      <button type="button" class="kpi-chip kpi-active" id="kpi-active-work" title="Lọc ban đang làm">
        <span class="kpi-dot live-beacon" style="background:#22d3ee"></span>
        <span>Đang làm: <strong>--</strong></span>
      </button>
      <button type="button" class="kpi-chip" id="kpi-queued-work" title="Lọc ban đang chờ">
        <span class="kpi-dot" style="background:#f59e0b"></span>
        <span>Chờ: <strong>--</strong></span>
      </button>
      <button type="button" class="kpi-chip" id="kpi-done-work" title="Lọc ban đã xong">
        <span class="kpi-dot" style="background:#10b981"></span>
        <span>Xong: <strong>--</strong></span>
      </button>
    </div>

    <div class="header-actions">
      <button id="token-summary-btn" type="button" title="Xem Quota & Runtime 6 phòng ban">
        <span id="token-summary-indicator">⚡ Quota 6 ban</span>
      </button>
      <div id="status" role="status">Đang kết nối…</div>
      <button id="btn-theme-toggle" class="icon-pill-btn" type="button" title="Đổi ánh sáng Neon / Sáng">
        ☀️ Sáng
      </button>
      <button id="btn-sync-now" class="icon-pill-btn" type="button" title="Đồng bộ dữ liệu ngay">
        ↻ Đồng bộ
      </button>
      <button id="btn-fullscreen-studio" class="icon-pill-btn" type="button" title="Thu nhỏ / Toàn màn hình">
        ⛶ Thu nhỏ
      </button>
    </div>
  </header>

  <main class="studio-workspace">
    <!-- LEFT: CYBER-COUTURE NEON 3D CITADEL (h1) -->
    <section class="floor" aria-label="Không gian xưởng thời trang 3D">
      <div class="canvas-hud-top">
        <div class="hud-group">
          <button type="button" class="hud-pill active" id="btn-toggle-links" title="Ẩn/hiện luồng năng lượng giữa các ban">
            🔗 Luồng
          </button>
          <button type="button" class="hud-pill active" id="btn-toggle-callouts" title="Ẩn/hiện nhãn việc trên từng tòa nhà">
            🏷️ Nhãn
          </button>
          <button type="button" class="hud-pill hud-showcase" id="btn-showcase-hud" title="Mở Sàn trưng bày sản phẩm 3D">
            ✦ Sàn 3D
          </button>
        </div>
        <div class="hud-group">
          <span class="hud-pill" id="zoom-indicator">🔍 100%</span>
        </div>
      </div>

      <svg id="scene" viewBox="-660 -470 1320 884" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Sơ đồ xưởng 3D tương tác">
        <defs>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.1" fill="var(--grid-dot)" opacity="var(--grid-dot-opacity)"/>
          </pattern>
          <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
            <feGaussianBlur stdDeviation="10"/>
          </filter>
          <filter id="neon-bloom" x="-45%" y="-45%" width="190%" height="190%">
            <feGaussianBlur stdDeviation="3.2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="neon-halo" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
          <linearGradient id="plazaTopDay" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fbff"/>
            <stop offset="52%" stop-color="#e8f1fc"/>
            <stop offset="100%" stop-color="#d2e2f8"/>
          </linearGradient>
          <linearGradient id="plazaTopNight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#192554"/>
            <stop offset="50%" stop-color="#0e1636"/>
            <stop offset="100%" stop-color="#150e33"/>
          </linearGradient>
          <linearGradient id="waterPool" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.72"/>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0.42"/>
          </linearGradient>
          <linearGradient id="spotlightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fde047" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="spotlightCyan" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.46"/>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="spotlightMagenta" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f472b6" stop-opacity="0.44"/>
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="holoCone" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.58"/>
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.06"/>
          </linearGradient>
          <linearGradient id="beaconSpire" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.62"/>
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect x="-3200" y="-2400" width="6400" height="4800" fill="url(#dots)"/>
        <g id="world"></g>
      </svg>

      <div class="canvas-hud-bottom">
        <div class="canvas-legend" aria-label="Chú giải trạng thái">
          <span class="legend-item"><span class="legend-dot" style="background:#22d3ee"></span>Đang làm</span>
          <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Chờ</span>
          <span class="legend-item legend-hide-compact"><span class="legend-dot" style="background:#10b981"></span>Xong</span>
          <span class="legend-item"><span class="legend-dot" style="background:#ef4444"></span>Hết quota</span>
        </div>

        <div class="camera-dock" role="toolbar" aria-label="Điều khiển góc nhìn">
          <button id="btn-open-token-modal" class="dock-primary" type="button">⚡ Quota</button>
          <button id="btn-focus-active" type="button" title="Tới ban đang làm việc">🎯 Đang làm</button>
          <button id="minus" type="button" aria-label="Thu nhỏ">−</button>
          <button id="reset" type="button">Toàn cảnh</button>
          <button id="plus" type="button" aria-label="Phóng to">+</button>
          <button id="btn-wide-sidebar" type="button" title="Mở rộng / thu gọn cột tab">⇔ Rộng</button>
          <button id="btn-collapse-sidebar" type="button" aria-expanded="true" title="Ẩn / hiện cột tab để xem 3D tối đa">⇥ Ẩn tab</button>
        </div>
      </div>
    </section>

    <!-- RIGHT: ULTRA-MINIMAL DEPARTMENT & TASK SIDEBAR (h2) -->
    <aside class="command-sidebar" aria-label="Bảng phòng ban và công việc">
      <div class="sidebar-head">
        <div class="sidebar-title-row">
          <div class="sidebar-title-left">
            <h1>Phòng ban</h1>
            <span class="sync-pill" id="sync-badge">●</span>
          </div>
          <div class="sidebar-head-actions">
            <button type="button" class="tiny-btn is-active" id="btn-sort-mode" title="Ưu tiên ban đang có việc lên đầu">⚡ Ưu tiên</button>
            <button type="button" class="tiny-btn" id="btn-expand-all" title="Mở/gọn mô tả công việc">Chi tiết</button>
          </div>
        </div>
        <div class="dept-filter-bar" id="dept-filter-tabs" role="tablist" aria-label="Lọc phòng ban">
          <button type="button" class="dept-filter-btn active" data-dept-filter="all">Tất cả</button>
          <button type="button" class="dept-filter-btn" data-dept-filter="active">⚡ Làm</button>
          <button type="button" class="dept-filter-btn" data-dept-filter="queued">⏳ Chờ</button>
          <button type="button" class="dept-filter-btn" data-dept-filter="done">✓ Xong</button>
        </div>
      </div>

      <div class="sidebar-scroll">
        <section id="active-spotlight" class="active-spotlight" aria-live="polite" hidden></section>
        <nav id="rooms" aria-label="Danh sách phòng ban"></nav>
        <section id="info" aria-live="polite" hidden></section>
        <section id="task-flow" aria-live="polite" hidden></section>
      </div>
    </aside>
  </main>

  <section id="showcase-overlay" class="showcase-overlay" role="dialog" aria-modal="true" aria-labelledby="showcase-title" aria-hidden="true">
    <div class="showcase-shell">
      <header class="showcase-head">
        <div class="showcase-head-left">
          <span class="showcase-crest" aria-hidden="true">✦</span>
          <div class="showcase-title-wrap">
            <h2 id="showcase-title">Sàn trưng bày 3D AtelierX</h2>
            <span id="showcase-count" class="showcase-count-pill">Đang tải…</span>
          </div>
        </div>
        <div class="showcase-head-right">
          <div id="showcase-filters" class="showcase-filters" role="tablist" aria-label="Lọc trạng thái sản phẩm">
            <button type="button" class="showcase-filter-btn active" data-showcase-filter="all">Tất cả</button>
            <button type="button" class="showcase-filter-btn" data-showcase-filter="complete">✓ Hoàn thiện</button>
            <button type="button" class="showcase-filter-btn" data-showcase-filter="preview">✦ Đang chỉnh</button>
          </div>
          <button id="showcase-open-tab" class="showcase-action-btn" type="button" title="Mở trình xem sản phẩm ở tab riêng">Mở tab riêng ↗</button>
          <button id="showcase-close" class="showcase-close" type="button">Đóng ×</button>
        </div>
      </header>
      <div class="showcase-body">
        <nav id="showcase-list" class="showcase-list" aria-label="Danh sách sản phẩm"></nav>
        <div class="showcase-view">
          <div id="showcase-meta" class="showcase-meta">Chọn một sản phẩm để xem 3D.</div>
          <iframe id="showcase-frame" class="showcase-frame" title="Sản phẩm AtelierX 3D" loading="lazy" allow="fullscreen"></iframe>
        </div>
      </div>
    </div>
  </section>

  <div id="token-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">⚡ Quota &amp; Runtime 6 Phòng Ban</h3>
        <div class="modal-header-actions">
          <button id="btn-manage-accounts" class="modal-manage-btn" type="button">+ Thêm / Quản lý Account</button>
          <button class="modal-close" id="modal-close-btn" type="button" aria-label="Đóng">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="modal-runtime-banner" class="modal-runtime-banner" hidden></div>
        <div class="modal-tabs">
          <button class="modal-tab-btn active" type="button" data-filter="all">Tất cả (6)</button>
          <button class="modal-tab-btn" type="button" data-filter="ok">🟢 Sẵn sàng / Còn quota</button>
          <button class="modal-tab-btn" type="button" data-filter="out">🔴 Hết quota / Dừng</button>
        </div>

        <table class="token-table">
          <thead>
            <tr>
              <th>Phòng ban</th>
              <th>Việc hiện tại</th>
              <th>Model &amp; Runtime</th>
              <th>Quota</th>
              <th>Đã dùng</th>
              <th>Ghi chú</th>
            </tr>
          </thead>
          <tbody id="token-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/atelierx.js?v=20261117v7"></script>
</body>
</html>
